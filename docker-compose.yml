services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin # dev only - never use in production
    ports:
      - "8180:8080" # offset from the mcp server's own 8080
    volumes:
      - ./keycloak/realm-spring-vision.json:/opt/keycloak/data/import/realm-spring-vision.json:ro
