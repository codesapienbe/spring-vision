# A remote deployment: `docker compose up -d` brings up the MCP server and Caddy in front of
# it (see docs/configuration/deploy-free.md). The server validates JWTs from your own OIDC
# issuer, so OAUTH2_ISSUER_URI must be set; local dev runs the app outside Docker (`make run`,
# or `make mcp-sync` for a local stdio client).
services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:?set OAUTH2_ISSUER_URI to your OIDC issuer}

  caddy:
    image: caddy:2-alpine
    depends_on:
      - mcp
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPRING_VISION_DOMAIN: ${SPRING_VISION_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
