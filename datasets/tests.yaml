# Reference test fixtures for the spring-vision MCP tools.
#
# Each top-level key is a tool name (without the _b/_u suffix).
# Each test case carries the image path (relative to repo root) and the
# expected truth. Use this file as the oracle when running smoke tests against
# the running MCP server; mismatches are model/threshold issues, not dataset bugs.
#
# detect_objects / count_faces fixtures were removed together with datasets/coco8
# (Ultralytics COCO8, AGPL-3.0). Re-add them with images whose licence allows
# redistribution, and record each image's source and licence here.

# Add new tools below as fixtures become available. Example shape:
#
# extract_text:
#   - image: datasets/<some-receipt>.jpg
#     expect_contains: ["TOTAL", "2026"]
#
# scan_barcode:
#   - image: datasets/<some-qr>.png
#     expect: { format: QR_CODE, payload: "hello" }

detect_vehicle_damages:
  - image: datasets/vehicle-damage/images/train/scratch_fiat500_door_001.png
    # PLACEHOLDER — real photo removed (private, not for public distribution).
    # Original: heavy multi-directional scratches across Fiat 500e door panel;
    # model mapped to doorouter-dent (LOW_CONFIDENCE, ~41%); ground truth class 14 (scratch).
    # Replace this placeholder with a real scratch image to restore the smoke test.
    skip: true
    ground_truth_class: scratch
