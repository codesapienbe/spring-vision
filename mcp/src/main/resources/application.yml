# Spring Vision MCP Server Configuration
# Model Context Protocol server for Spring Vision computer vision capabilities

spring:
  application:
    name: spring-vision-mcp

  # Main application settings
  main:
    web-application-type: servlet  # Servlet stack required for Streamable-HTTP MCP transport
    banner-mode: off  # Disable banner for cleaner output

  # Jackson JSON configuration
  jackson:
    serialization:
      indent-output: false
      fail-on-empty-beans: false

  # Spring Vision Configuration
  vision:
    djl:
      # Enable DJL backend (default: true)
      enabled: true

      # Engine selection: pytorch (default), tensorflow, mxnet, onnx
      engine: pytorch

      # Device: cpu (default), gpu, gpu:0, gpu:1, etc.
      device: cpu

      # Auto-download models from DJL Model Zoo (default: true)
      auto-download: true

      # Show a progress bar during model download (default: false)
      show-progress: false

      # Maximum concurrent inference threads (default: 4)
      max-concurrent-inferences: 16

      # Face Detection Configuration
      face-detection:
        # Use an object-detection-style model that prefetch works with
        model: ssd_300_resnet50
        confidence-threshold: 0.35
        max-faces: 200

      # Face Recognition Configuration
      face-recognition:
        # Prefer a model that prefetch resolves: resnet18_embedding
        model: resnet18_embedding
        embedding-size: 512
        similarity-threshold: 0.5

      # Object Detection Configuration
      object-detection:
        # Model: yolo (default), ssd
        model: yolo
        # Backbone: resnet50, mobilenet, etc. (only used with SSD)
        backbone: resnet50
        confidence-threshold: 0.5
        top-k: 10

      # Pose Estimation Configuration
      pose-estimation:
        # Model: yolo (default), simple_pose
        model: yolo
        joints: 17  # COCO 17 keypoints
        confidence-threshold: 0.5

      # Vehicle Damage Detection Configuration
      vehicle-damage:
        min-confidence: 0.15

      # Online damage classifier (label submission + incremental training)
      online-classifier:
        enabled: true
        dataset-dir: datasets/vehicle-damage
        min-batch-size: 8

      # Action Recognition Configuration
      action-recognition:
        model: ""
        confidence-threshold: 0.6

      # Segmentation Configuration
      segmentation:
        # Model: instance_segmentation, semantic_segmentation
        model: instance_segmentation
        instance-level: true

  # MCP Server Configuration (Spring AI 1.1.0 - Streamable-HTTP transport)
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: spring-vision
        version: "1.0.5"
        description: "Spring Vision MCP Server - Computer Vision Operations via Model Context Protocol"

  # MCP auth: OAuth2 Resource Server validating Keycloak-issued JWTs (see keycloak/README.md).
  # Defaults to the local dev Keycloak started via `make keycloak-up`; override KEYCLOAK_ISSUER_URI
  # to point at a different realm (e.g. a future production Keycloak).
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/spring-vision}

server:
  port: 8080  # Internal port; a reverse proxy (e.g. Caddy) should terminate TLS in front of this

# Logging configuration - JSON format via logback-spring.xml
logging:
  level:
    root: INFO
    io.github.codesapienbe.springvision: INFO
    org.springframework.ai: WARN
    org.springframework.ai.mcp: INFO
  # Pattern and file configurations are managed by logback-spring.xml
  # All logs use JSON format for consistent parsing
