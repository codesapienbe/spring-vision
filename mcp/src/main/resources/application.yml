# Spring Vision MCP Server Configuration
# Model Context Protocol server for Spring Vision computer vision capabilities

spring:
  application:
    name: spring-vision-mcp

  # Main application settings
  main:
    web-application-type: servlet  # Servlet stack required for Streamable-HTTP MCP transport
    banner-mode: off  # Disable banner for cleaner output

  # Jackson JSON configuration
  jackson:
    serialization:
      indent-output: false
      fail-on-empty-beans: false

  # Spring Vision Configuration
  vision:
    djl:
      # Enable DJL backend (default: true)
      enabled: true

      # Engine selection: pytorch (default), tensorflow, mxnet, onnx
      engine: pytorch

      # Device: cpu (default), gpu, gpu:0, gpu:1, etc.
      device: cpu

      # Auto-download models from DJL Model Zoo (default: true)
      auto-download: true

      # Show a progress bar during model download (default: false)
      show-progress: false

      # Maximum concurrent inference threads (default: 4)
      max-concurrent-inferences: 16

      # Face Detection Configuration
      face-detection:
        confidence-threshold: 0.35
        max-faces: 200

      # Face Recognition Configuration
      face-recognition:
        # Prefer a model that prefetch resolves: resnet18_embedding
        model: resnet18_embedding
        embedding-size: 512
        similarity-threshold: 0.5

      # Object Detection Configuration
      object-detection:
        # Backbone: resnet50, mobilenet, etc.
        backbone: resnet50
        confidence-threshold: 0.5
        top-k: 10

      # Pose Estimation Configuration
      pose-estimation:
        joints: 17  # COCO 17 keypoints
        confidence-threshold: 0.5

      # Vehicle Damage Detection Configuration
      vehicle-damage:
        min-confidence: 0.15

      # Online damage classifier (label submission + incremental training)
      online-classifier:
        enabled: true
        dataset-dir: datasets/vehicle-damage
        min-batch-size: 8

      # Action Recognition Configuration
      action-recognition:
        model: ""
        confidence-threshold: 0.6

      # Segmentation Configuration
      segmentation:
        # Model: instance_segmentation, semantic_segmentation
        model: instance_segmentation
        instance-level: true

    # MCP tool access. The server runs no identity provider of its own: over HTTP it trusts the
    # issuer below (spring.security.oauth2.resourceserver.jwt.issuer-uri), reads the caller's
    # roles from roles-claim-path, and runs a tool only if one of those roles is granted it here.
    # A tool not granted to any of the caller's roles is denied. "*" grants every tool. Names
    # that match no tool fail start-up. Over stdio there is no token: the caller has stdio-roles.
    mcp:
      security:
        # Claim path to the role list, one element per level: Keycloak realm roles are
        # [realm_access, roles]; client roles are [resource_access, <client-id>, roles].
        roles-claim-path: [realm_access, roles]
        tool-access:
          - role: mcp-admin
            tools: ["*"]
          # Everything except biometric templates and identification (embeddings, face
          # verification and search, identity store, access authentication), identity and
          # driving-licence documents, licence plates, NSFW, deepfake and threat detection.
          - role: mcp-user
            tools:
              - count_faces_b
              - count_faces_u
              - count_faces_b_validated
              - preview_faces_u
              - extract_text_b
              - extract_text_u
              - classify_image_b
              - classify_image_u
              - detect_objects_b
              - detect_objects_u
              - detect_poses_b
              - detect_poses_u
              - recognize_actions_b
              - recognize_actions_u
              - detect_emotions_b
              - detect_emotions_u
              - detect_hands_b
              - detect_hands_u
              - detect_demographics_b
              - detect_demographics_u
              - detect_fall_b
              - detect_fall_u
              - analyze_stress_b
              - analyze_stress_u
              - estimate_heart_rate_f
              - estimate_heart_rate_u
              - extract_image_metadata_b
              - extract_image_metadata_u
              - scan_barcode_b
              - scan_barcode_u
              - detect_vehicle_b
              - detect_vehicle_u
              - detect_vehicle_damages_b
              - detect_vehicle_damages_u
              - submit_damage_label_b
              - submit_damage_label_u
              - export_damage_classifier
              - annotate_bounding_boxes_b
              - annotate_bounding_boxes_u
              - obscure_regions_b
              - obscure_regions_u
              - normalize_image_b
              - normalize_image_u
              - delete_temp_image
              - setup_status
              - read_document
        stdio-roles: [mcp-admin]
      # A tool whose model is still downloading waits this long, then answers "still setting up".
      model-wait: 5s

  # MCP Server Configuration (Spring AI 1.1.0 - Streamable-HTTP transport)
  ai:
    mcp:
      server:
        enabled: true
        protocol: STREAMABLE
        name: spring-vision
        version: "1.0.5"
        description: "Spring Vision MCP Server - Computer Vision Operations via Model Context Protocol"
        instructions: >-
          spring-vision reads files on this computer, locally and privately, without sending them
          anywhere. When the user asks to read, extract or summarise a document or image that is on their
          computer (PDF, Word, Excel, PowerPoint, PNG, JPEG, WebP), call read_document with its path, for
          example ~/Downloads/certificate.pdf; it returns the text per page, reading Dutch, English, French
          and German. A file attached to this chat is not on the computer and spring-vision cannot see it:
          ask the user for the file's path on their computer instead.
          Some tools need a model that spring-vision downloads on its first run. If a tool answers that
          spring-vision is still setting up, nothing was run: call setup_status, wait until the tool's
          models are ready, then retry the same call. Never present that setup message as the tool's result.

  # MCP auth over HTTP: OAuth2 Resource Server validating JWTs from this OIDC issuer (any
  # provider: Keycloak, Auth0, Entra ID, ...). Required for the HTTP server; start-up fails
  # without it. Not used by the stdio profile. Tool access: spring.vision.mcp.security above.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}

server:
  port: 8080  # Internal port; a reverse proxy (e.g. Caddy) should terminate TLS in front of this

# Logging configuration - JSON format via logback-spring.xml
logging:
  level:
    root: INFO
    io.github.codesapienbe.springvision: INFO
    org.springframework.ai: WARN
    org.springframework.ai.mcp: INFO
  # Pattern and file configurations are managed by logback-spring.xml
  # All logs use JSON format for consistent parsing
