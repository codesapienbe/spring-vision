# Local, single-user mode (`--spring.profiles.active=stdio`): the MCP client, e.g. Claude Code,
# launches this JAR and talks to it over stdin/stdout. No HTTP port, no token and no issuer; the
# caller has spring.vision.mcp.security.stdio-roles. See docs/getting-started/mcp-setup.md.
spring:
  main:
    web-application-type: none
  ai:
    mcp:
      server:
        stdio: true
  # Local mode is what a desktop install runs: models that are not bundled are downloaded in the
  # background into ~/.springvision/models, and each model is loaded on its first use, so the
  # server answers the client at once.
  vision:
    djl:
      models:
        download: true
        lazy: true
