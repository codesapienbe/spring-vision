name: Auto Release on Merge

# Every push to the default branch (CSNET) auto-bumps the patch version,
# commits it back, and tags it — the tag push then triggers deploy.yml,
# which builds, publishes to GitHub Packages, and creates the GitHub Release.
# The latest `v*` git tag is the single source of truth for the next version
# number; VERSION and the poms are just kept in sync with it for local
# tooling (Makefile), never read to decide the next version.
# Manual releases via `make release` still work unchanged: this workflow only
# adds an automatic tag on top of ordinary merges.
on:
  push:
    branches:
      - CSNET

jobs:
  bump-and-tag:
    name: Bump Version and Tag Release
    runs-on: ubuntu-latest
    # Guard against the version-bump commit this job pushes re-triggering itself.
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version to')"
    permissions:
      contents: write
    steps:
      - name: Verify required secrets and variables
        run: |
          MISSING=()
          if [ -z "$APP_ID" ]; then
            MISSING+=("APP_ID (repository variable)")
          fi
          if [ -z "$APP_PRIVATE_KEY" ]; then
            MISSING+=("APP_PRIVATE_KEY (repository secret)")
          fi
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Missing: ${MISSING[*]}"
            exit 1
          fi
        env:
          APP_ID: ${{ vars.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ubuntu-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-maven-

      - name: Bump patch version
        id: bump
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          CURRENT_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "$NEW_VERSION" > VERSION
          mvn -B versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true -q
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumping $LATEST_TAG -> v$NEW_VERSION"

      - name: Configure Git identity
        run: |
          git config user.name "codesapienbe[bot]"
          git config user.email "codesapienbe[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git"

      - name: Commit version bump
        run: |
          git add VERSION pom.xml core/pom.xml starter/pom.xml mcp/pom.xml cli/pom.xml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:CSNET

      - name: Tag release
        run: |
          git tag -a "v${{ steps.bump.outputs.new_version }}" -m "Release v${{ steps.bump.outputs.new_version }}"
          git push origin "v${{ steps.bump.outputs.new_version }}"
